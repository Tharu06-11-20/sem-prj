
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarineVision | Admin Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #eaf4f6;
        }
        .login-box {
            width: 340px;
            max-width: 85%;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px #0002;
        }
        h2 { color: #075985; text-align: center; }
        label { display: block; margin-top: 15px; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #bbb;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            color: white;
            background: #075985;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
        .message { color: #b91c1c; }
        a { color: #075985; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>MarineVision Admin</h2>
        <p>Sign in to manage the system.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin_login') }}">
            <label for="username">Admin Username</label>
            <input id="username" name="username"
                   type="text" required autocomplete="username">

            <label for="password">Password</label>
            <input id="password" name="password"
                   type="password" required
                   autocomplete="current-password">

            <button type="submit">Admin Sign In</button>
        </form>

        <p><a href="{{ url_for('login') }}">Regular user login</a></p>
    </div>
</body>
</html>
