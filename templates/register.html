
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - MarineVision</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .register-container {
            max-width: 480px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }
        .register-container h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 30px;
        }
        .register-container .subtitle {
            text-align: center;
            margin-bottom: 25px;
            color: #637981;
        }
        .register-container label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }
        .register-container input,
        .register-container select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd9d8;
            border-radius: 6px;
            font-size: 15px;
        }
        .optional-note { color: #637981; font-size: 13px; }
        .register-container button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #087f78;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        .register-container button:hover {
            background: #065e59;
        }
        .register-container .bottom-link {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h2>MarineVision</h2>
        <nav>
            <a href="/">Home</a>
            <a href="/login">Sign In</a>
        </nav>
    </header>

    <div class="register-container">
        <h1>Create Account</h1>
        <p class="subtitle">Join the MarineVision platform</p>
        {% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for message in messages %}
            <p style="background:#e5f5ed; color:#087f78;
                      padding:12px; border-radius:6px;
                      margin-bottom:15px;">
                {{ message }}
            </p>
        {% endfor %}
    {% endif %}
{% endwith %}
        <form action="/register" method="POST">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="contact_number">Contact Number</label>
            <input type="tel" id="contact_number" name="contact_number" required
                   placeholder="Include country code where applicable">

            <label for="address">Address</label>
            <input type="text" id="address" name="address" required
                   placeholder="Enter your address">

            <label for="profession">Profession</label>
            <select id="profession" name="profession" required>
                <option value="">Select your profession</option>
                <option>Student</option><option>Researcher</option>
                <option>Marine Biologist</option><option>Environmental Scientist</option>
                <option>Fisheries Professional</option><option>Other</option>
            </select>
            <div id="profession-other-wrap" hidden>
                <label for="profession_other">Specify Profession</label>
                <input type="text" id="profession_other" name="profession_other">
            </div>

            <label for="designation">Designation</label>
            <input type="text" id="designation" name="designation" required
                   placeholder="Your role or designation">

            <label for="highest_qualification">Highest Qualification <span class="optional-note">(optional)</span></label>
            <input type="text" id="highest_qualification" name="highest_qualification">

            <label for="areas_of_interest">Areas of Interest <span class="optional-note">(optional)</span></label>
            <input type="text" id="areas_of_interest" name="areas_of_interest"
                   placeholder="e.g. marine ecology, pollution monitoring">

            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   placeholder="Choose a username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Create a password" required>

            <label for="role">Register As</label>
            <select id="role" name="role" required>
                <option value="">Select your role</option>
                <option value="developer">Developer</option>
                <option value="organization">Organization</option>
            </select>

            <div id="organization-name-wrap" hidden>
                <label for="organization_name">Organization Name</label>
                <input type="text" id="organization_name" name="organization_name">
            </div>

            <button type="submit">Create Account</button>
        </form>

        <p class="bottom-link">
            Already have an account? <a href="/login">Sign In</a>
        </p>
    </div>
    <script>
        const professionSelect = document.getElementById('profession');
        const otherWrap = document.getElementById('profession-other-wrap');
        const otherInput = document.getElementById('profession_other');
        const roleSelect = document.getElementById('role');
        const organizationWrap = document.getElementById('organization-name-wrap');
        const organizationInput = document.getElementById('organization_name');
        function updateConditionalFields() {
            const isOther = professionSelect.value === 'Other';
            otherWrap.hidden = !isOther;
            otherInput.required = isOther;
            const isOrganization = roleSelect.value === 'organization';
            organizationWrap.hidden = !isOrganization;
            organizationInput.required = isOrganization;
        }
        professionSelect.addEventListener('change', updateConditionalFields);
        roleSelect.addEventListener('change', updateConditionalFields);
        updateConditionalFields();
    </script>
</body>
</html>
