<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Analytics | MarineVision</title><style>
body{font:16px Arial,sans-serif;background:#eef5f7;color:#173b46;margin:0;padding:24px}.wrap{max-width:800px;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}.card{background:white;padding:24px;border-radius:12px;box-shadow:0 3px 12px #0001}.number{font-size:34px;color:#087f78;font-weight:bold}.btn{display:inline-block;background:#087f78;color:white;padding:10px 14px;border-radius:6px;text-decoration:none;margin:5px 5px 5px 0}
</style></head><body><main class="wrap"><h1>Personal Analytics</h1><p>Statistics for your own account only.</p><div class="cards"><section class="card">Organism detections<div class="number">{{ organism }}</div></section><section class="card">Pollution detections<div class="number">{{ pollution }}</div></section></div><p><a class="btn" href="{{ url_for('detection_history') }}">Organism History</a><a class="btn" href="{{ url_for('pollution_history') }}">Pollution History</a><a class="btn" href="{{ url_for('dashboard') }}">Dashboard</a></p></main></body></html>
